{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="theme-color"
        content="#c41e3a">

    <title>
        {% block title %}
            Donor Panel | LifeServe
        {% endblock %}
    </title>


    <!-- =================================
         BOOTSTRAP
    ================================== -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- =================================
         BOOTSTRAP ICONS
    ================================== -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <!-- =================================
         DONOR BASE CSS
    ================================== -->

    <link
        rel="stylesheet"
        href="{% static 'css/donor.css' %}">

    <link rel="stylesheet" href="{% static 'css/language-switcher.css' %}">
    <link rel="stylesheet" href="{% static 'css/skeleton-loading.css' %}">


    <!-- =================================
         DONOR SIDEBAR CSS
    ================================== -->

    <link
        rel="stylesheet"
        href="{% static 'css/donor-sidebar.css' %}">
         <!-- <link rel="stylesheet" href="{% static 'css/donor-dashboard.css' %}"> -->



    <!-- =================================
         PAGE SPECIFIC CSS
    ================================== -->

    {% block extra_css %}
            <link rel="stylesheet" href="{% static 'css/profile-content.css' %}">

   
    {% endblock %}

</head>


<body>

<div class="site-skeleton" aria-hidden="true">
    <div class="site-skeleton-inner">
        <div class="site-skeleton-nav"><span></span><span></span><span></span><span></span></div>
        <div class="site-skeleton-hero"><div></div><div></div><div></div></div>
        <div class="site-skeleton-toolbar"><span></span><span></span><span></span></div>
        <div class="site-skeleton-cards"><div></div><div></div><div></div></div>
    </div>
</div>

<div class="donor-app">


    <!-- =================================
         SIDEBAR
    ================================== -->

    {% include "donor/sidebar.html" %}


    <!-- =================================
         MAIN CONTENT
    ================================== -->

    <main class="main-content">


        <!-- =================================
             MOBILE HEADER
        ================================== -->

        <header class="donor-mobile-header">

            <div class="mobile-brand">

                <div class="mobile-brand-icon">

                    <!-- <i class="bi bi-droplet-fill"></i> -->

                </div>

                <div class="mobile-brand-text">

                    <strong>
                        <!-- LifeServe -->
                    </strong>

                    <span>
                        <!-- Donor Panel -->
                    </span>

                </div>

            </div>

        </header>


        <!-- =================================
             PAGE CONTENT
        ================================== -->

        <section class="donor-page-content">

            {% block content %}

            {% endblock %}

        </section>


        <!-- =================================
             FOOTER
        ================================== -->

        <footer class="donor-footer">

            <div class="donor-footer-brand">

                <i class="bi bi-heart-pulse-fill"></i>

                <span>
                    LifeServe Blood Bank
                </span>

            </div>

            <div class="donor-footer-panel">

                Donor Panel
                <span class="footer-dot">•</span>
                Secure Portal

            </div>

        </footer>


    </main>

</div>


<!-- =================================
     BOOTSTRAP JS
================================== -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
</script>
<script src="{% static 'js/skeleton-loading.js' %}"></script>


<!-- =================================
     CHART JS
================================== -->

<script
    src="https://cdn.jsdelivr.net/npm/chart.js">
</script>


<!-- =================================
     EXTRA JAVASCRIPT
================================== -->

{% block extra_js %}

{% endblock %}


</body>

</html>

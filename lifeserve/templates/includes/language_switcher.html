{% load i18n %}
<form action="{% url 'set_language' %}" method="post" class="language-switcher">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ request.get_full_path }}">
    <i class="bi bi-globe2 language-switcher-icon" aria-hidden="true"></i>
    <select name="language" aria-label="{% translate 'Select language' %}" onchange="this.form.submit()">
        {% get_current_language as CURRENT_LANGUAGE %}
        {% get_available_languages as AVAILABLE_LANGUAGES %}
        {% for language_code, language_name in AVAILABLE_LANGUAGES %}
            <option value="{{ language_code }}" {% if language_code == CURRENT_LANGUAGE %}selected{% endif %}>{{ language_name }}</option>
        {% endfor %}
    </select>
</form>
